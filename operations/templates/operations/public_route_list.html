{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row">
        <div class="col-md-12 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="text-dark"><i class="bi bi-signpost-split-fill text-danger me-2"></i> All Routes & Stoppages
                </h2>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to
                    Home</a>
            </div>
        </div>

        {% for route in routes %}
        <div class="col-md-6 mb-4">
            <div class="d-flex flex-column h-100 p-3 rounded-3 shadow-sm"
                style="background-color: #fff; border-left: 5px solid #0d6efd;">
                <h5 class="fw-bold text-dark mb-3 text-uppercase border-bottom pb-2">
                    <i class="bi bi-diamond-fill text-primary me-2"></i>{{ route.name }}
                </h5>

                <ul class="list-unstyled ps-2 mb-0">
                    {% for rs in route.routestop_set.all %}
                    <li class="mb-2 text-secondary d-flex align-items-start">
                        <i class="bi bi-circle-fill text-secondary me-2 mt-1" style="font-size: 0.4rem;"></i>
                        <span>{{ rs.stop.name }}</span>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="alert alert-light text-center">No routes available at the moment.</div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
