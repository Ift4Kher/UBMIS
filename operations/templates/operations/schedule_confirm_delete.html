{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4 text-center">
                <div class="text-warning mb-3">
                    <i class="bi bi-exclamation-triangle-fill display-1"></i>
                </div>
                <h2 class="card-title fw-bold mb-3">Delete Schedule?</h2>
                <p class="card-text text-muted mb-4">
                    Are you sure you want to delete the schedule for <strong>{{ schedule.route.name }}</strong>
                    departing at <strong>{{ schedule.departure_time|time:"h:i A" }}</strong>?
                    This action cannot be undone.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'schedule_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4">Confirm Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
