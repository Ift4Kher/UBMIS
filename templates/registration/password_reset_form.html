<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - UBMIS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-teal: #0d6efd;
            --accent-blue: #0d6efd;
            --text-muted: #6c757d;
        }

        body,
        html {
            min-height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            overflow-x: hidden;
        }

        .auth-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('{% if site_settings.auth_image %}{{ site_settings.auth_image.url }}{% else %}https://images.unsplash.com/photo-1582139329536-e7284fece509?q=80&w=2080&auto=format&fit=crop{% endif %}') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 2rem;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin: 20px;
        }

        .auth-header h2 {
            font-weight: 800;
            font-size: 1.8rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #444;
            margin-bottom: 0.5rem;
        }

        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.6rem;
            border: 1px solid #dee2e6;
            font-size: 0.95rem;
        }

        .btn-reset {
            background-color: var(--primary-teal);
            border: none;
            color: #fff;
            padding: 0.8rem;
            font-weight: 700;
            border-radius: 0.6rem;
            text-transform: uppercase;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-reset:hover {
            background-color: #0c2b30;
            transform: translateY(-1px);
        }

        .back-link {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary-teal);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="auth-bg"></div>
    <div class="auth-card">
        <div class="auth-header text-center">
            <div class="mb-3">
                <i class="bi bi-key-fill text-primary" style="font-size: 3rem;"></i>
            </div>
            <h2>Reset Password</h2>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label for="id_email" class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" id="id_email" placeholder="name@university.edu"
                    required>
            </div>

            <button type="submit" class="btn btn-reset mb-4">Send Reset Link</button>

            <div class="text-center">
                <a href="{% url 'login' %}" class="back-link">
                    <i class="bi bi-arrow-left me-2"></i>Back to Login
                </a>
            </div>
        </form>
    </div>
</body>

</html>
