<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent - UBMIS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-teal: #0d6efd;
            --accent-blue: #0d6efd;
            --text-muted: #6c757d;
        }

        body,
        html {
            min-height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            overflow-x: hidden;
        }

        .auth-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('{% if site_settings.auth_image %}{{ site_settings.auth_image.url }}{% else %}https://images.unsplash.com/photo-1582139329536-e7284fece509?q=80&w=2080&auto=format&fit=crop{% endif %}') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 2rem;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin: 20px;
            text-align: center;
        }

        .auth-header h2 {
            font-weight: 800;
            font-size: 1.8rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-home {
            background-color: var(--primary-teal);
            border: none;
            color: #fff;
            padding: 0.8rem 2rem;
            font-weight: 700;
            border-radius: 0.6rem;
            text-transform: uppercase;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-home:hover {
            background-color: #0c2b30;
            transform: translateY(-1px);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="auth-bg"></div>
    <div class="auth-card">
        <div class="auth-header">
            <div class="mb-3">
                <i class="bi bi-envelope-check-fill text-success" style="font-size: 3rem;"></i>
            </div>
            <h2>Check Your Email</h2>
            <p>We've emailed you instructions for setting your password, if an account exists with the email you
                entered. You should receive them shortly.</p>
            <p>If you don't receive an email, please make sure you've entered the address you registered with, and check
                your spam folder.</p>
        </div>

        <a href="{% url 'login' %}" class="btn-home mt-2">Back to Login</a>
    </div>
</body>

</html>
