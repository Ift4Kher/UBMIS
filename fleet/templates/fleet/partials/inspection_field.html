<div class="inspection-item-wrapper mb-2">
    <div class="inspection-item">
        <div>
            <span class="item-label">{{ label }}</span>
            {% if critical %}<span class="critical-badge">CRITICAL</span>{% endif %}
        </div>
        <div class="pass-fail-toggle">
            <input type="radio" name="{{ field.name }}" id="{{ field.id_for_label }}_pass" value="True" {% if
                field.value==True or field.value=='True' or field.value==None %}checked{% endif %} class="toggle-pass">
            <label for="{{ field.id_for_label }}_pass">PASS</label>
            <input type="radio" name="{{ field.name }}" id="{{ field.id_for_label }}_fail" value="False" {% if
                field.value==False or field.value=='False' %}checked{% endif %} class="toggle-fail"
                data-critical="{{ critical|lower }}">
            <label for="{{ field.id_for_label }}_fail">FAIL</label>
        </div>
    </div>
    {% if field.errors %}
    <div class="text-danger small mt-1 px-2">{{ field.errors.0 }}</div>
    {% endif %}
</div>
