{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-danger py-4 px-4">
                    <h3 class="text-white mb-0">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>Confirm Delete
                    </h3>
                </div>
                <div class="card-body p-4 text-center">
                    <p class="lead mb-4">Are you sure you want to delete the notice: <br>
                        <strong class="text-primary">"{{ notice.title }}"</strong>?
                    </p>
                    <p class="text-muted small mb-4">This action cannot be undone.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'admin_notice_list' %}" class="btn btn-light rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold shadow-sm">
                                Yes, Delete Notice
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
