{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Confirm Delete</h4>
            </div>
            <div class="card-body text-center">
                <p class="lead">Are you sure you want to delete this slider image?</p>
                {% if image.caption %}
                <p class="fw-bold">"{{ image.caption }}"</p>
                {% endif %}
                <img src="{{ image.image.url }}" class="img-thumbnail mb-3" style="max-height: 200px;">

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'slider_image_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
