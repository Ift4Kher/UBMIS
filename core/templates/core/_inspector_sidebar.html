<div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
    <div class="card-header bg-dark text-white py-3">
        <h6 class="mb-0 fw-bold"><i class="bi bi-funnel me-2"></i>Navigation Hub</h6>
    </div>
    <div class="list-group list-group-flush">
        <a href="{% url 'inspector_dashboard' %}"
            class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'inspector_dashboard' %}active{% endif %} border-0">
            <i class="bi bi-speedometer2 me-2"></i>Overview
        </a>
        <a href="{% url 'inspection_list' %}"
            class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'inspection_list' %}active{% endif %} border-0">
            <i class="bi bi-journal-text me-2"></i>Inspection History
        </a>
        <a href="{% url 'inspection_create' %}"
            class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'inspection_create' %}active{% endif %} border-0">
            <i class="bi bi-plus-circle me-2"></i>New Inspection
        </a>
    </div>
</div>

<!-- Stats Card -->
<div class="card border-0 shadow-sm rounded-4 bg-primary text-white p-4">
    <h2 class="fw-bold mb-1">Pass / Fail</h2>
    <p class="opacity-75 small">Safety first. Ensure every bus meets the regulatory standards before
        deployment.</p>
    <div class="mt-3">
        <div class="d-flex justify-content-between small mb-1">
            <span>System Health</span>
            <span>100%</span>
        </div>
        <div class="progress bg-white bg-opacity-25" style="height: 6px;">
            <div class="progress-bar bg-white" style="width: 100%"></div>
        </div>
    </div>
</div>
